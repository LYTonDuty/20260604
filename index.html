<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的寶可夢圖鑑 - 終極版</title>
    <style>
        body {
            font-family: '微軟正黑體', sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column; 
            align-items: center;    
            padding: 50px 20px;
            min-height: 100vh;
            margin: 0;
        }

        .search-box {
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
        }
        
        .search-box input {
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 8px;
            outline: none;
            width: 250px;
        }
        
        .search-box button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #ffcb05; 
            color: #3b4cca; 
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .search-box button:hover {
            background-color: #e6b800;
        }

        #random-btn {
            background-color: #ff4c4c;
            color: white;
        }
        #random-btn:hover {
            background-color: #cc0000;
        }

        #poke-container {
            display: flex;
            flex-wrap: wrap; 
            gap: 20px;
            justify-content: center;
            max-width: 1200px; 
        }

        /* 卡牌樣式 */
        .card {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15); 
            padding: 30px 20px; /* 調整內距讓卡片視覺更平衡 */
            text-align: center;
            width: 200px; 
            border: 8px solid #ffde00; 
            animation: fadeIn 0.5s ease; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .card img {
            width: 120px;
            background-color: #f0f0f0;
            border-radius: 50%;
            margin-bottom: 10px;
            border: 4px solid #3b4cca; 
        }
        
        .card h2 {
            margin: 0;
            color: #333;
            text-transform: capitalize; 
            font-size: 20px;
        }
        
        .card p.id-text {
            color: #888;
            margin: 5px 0 15px 0;
            font-weight: bold;
        }

        /* 🌟 新增：特性的徽章樣式 */
        .ability-badge {
            background-color: #e2e8f0;
            color: #475569;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            text-transform: capitalize;
            width: 90%;
            border: 1px dashed #cbd5e1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="search-box">
        <input type="text" id="poke-input" placeholder="輸入英文名或編號 (例: pikachu)">
        <button id="search-btn">🔍 尋找</button>
        <button id="random-btn">🎲 隨機抽 10 張</button>
    </div>

    <div id="poke-container">
        <div class="card">
            <h2>Pokédex</h2>
            <p class="id-text">等待指令...</p>
        </div>
    </div>

    <script>
        const searchBtn = document.getElementById('search-btn');
        const randomBtn = document.getElementById('random-btn'); 
        const pokeInput = document.getElementById('poke-input');
        const container = document.getElementById('poke-container');

        // 單次搜尋功能
        async function searchPokemon(query) {
            const target = query.toLowerCase().trim();
            if (!target) return;

            container.innerHTML = `<div class="card" style="width: 100%;"><p>丟出精靈球中... 🔴</p></div>`;

            try {
                const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${target}`);
                if (!response.ok) throw new Error("找不到");
                
                const data = await response.json();
                renderCard(data, true); 
            } catch (error) {
                container.innerHTML = `<div class="card"><h2>❓</h2><p>找不到這隻寶可夢</p></div>`;
            }
        }

        // 隨機抽 10 張功能
        async function drawTenRandom() {
            container.innerHTML = `<div class="card" style="width: 100%;"><p>正在尋找 10 隻寶可夢... ⚡</p></div>`;
            let allCardsHTML = "";

            for (let i = 0; i < 10; i++) {
                const randomId = Math.floor(Math.random() * 1025) + 1;
                try {
                    const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${randomId}`);
                    const data = await response.json();
                    
                    const pokeName = data.name; 
                    const pokeImage = data.sprites.front_default; 
                    const pokeId = data.id; 
                    
                    // 🌟 這裡也加上特性抓取
                    const pokeAbilities = data.abilities.map(item => item.ability.name).join(' / ');
                    
                    allCardsHTML += `
                        <div class="card">
                            <img src="${pokeImage}" alt="${pokeName}">
                            <h2>${pokeName}</h2>
                            <p class="id-text">#${pokeId}</p>
                            <div class="ability-badge">✨ ${pokeAbilities}</div>
                        </div>
                    `;
                } catch (error) {
                    console.log("有一隻寶可夢迷路了");
                }
            }
            container.innerHTML = allCardsHTML;
        }

        // 🌟 獨立的渲染卡片函式 (把抓特性的邏輯加進來)
        function renderCard(data, clearFirst) {
            const pokeName = data.name; 
            const pokeImage = data.sprites.front_default; 
            const pokeId = data.id; 
            
            // 💡 抓取特性的終極寫法：map 搭配 join
            const pokeAbilities = data.abilities.map(item => item.ability.name).join(' / ');
            
            const cardHTML = `
                <div class="card">
                    <img src="${pokeImage}" alt="${pokeName}">
                    <h2>${pokeName}</h2>
                    <p class="id-text">#${pokeId}</p>
                    <div class="ability-badge">✨ ${pokeAbilities}</div>
                </div>
            `;

            if (clearFirst) {
                container.innerHTML = cardHTML;
            } else {
                container.innerHTML += cardHTML;
            }
        }

        searchBtn.addEventListener('click', () => searchPokemon(pokeInput.value));
        pokeInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') searchPokemon(pokeInput.value); });
        randomBtn.addEventListener('click', drawTenRandom);

    </script>
</body>
</html>
